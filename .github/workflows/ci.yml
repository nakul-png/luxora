name: LUXORA CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write


# ============================================================
# FRONTEND
# ============================================================

jobs:

  frontend:
    name: Frontend Docker Build + Trivy Scan + Push
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # 1. Checkout
      # ----------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4


      # ----------------------------------------
      # 2. Build Docker Image
      # ----------------------------------------

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            luxora-frontend:${{ github.sha }}
            luxora-frontend:latest
          build-args: |
            NEXT_PUBLIC_PRODUCT_API=http://localhost:8000


      # ----------------------------------------
      # 3. Trivy Security Scan
      # ----------------------------------------

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: luxora-frontend:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH


      # ----------------------------------------
      # 4. Login to GHCR
      # Only on push to main
      # ----------------------------------------

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ----------------------------------------
      # 5. Tag Image
      # ----------------------------------------

      - name: Tag frontend image
        if: github.event_name == 'push'
        run: |
          docker tag \
            luxora-frontend:${{ github.sha }} \
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}

          docker tag \
            luxora-frontend:${{ github.sha }} \
            ghcr.io/${{ github.repository }}/frontend:latest


      # ----------------------------------------
      # 6. Push to GHCR
      # ----------------------------------------

      - name: Push frontend image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/frontend:latest


  # ============================================================
  # CART SERVICE
  # ============================================================

  cart-service:
    name: Cart Service Docker Build + Trivy Scan + Push
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # 1. Checkout
      # ----------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4


      # ----------------------------------------
      # 2. Build Docker Image
      # ----------------------------------------

      - name: Build cart service image
        uses: docker/build-push-action@v6
        with:
          context: ./cart-service
          load: true
          tags: |
            luxora-cart-service:${{ github.sha }}
