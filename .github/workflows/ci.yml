        with:
          image-ref: luxora-cart-service:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH


      # ----------------------------------------
      # 4. Login to GHCR
      # ----------------------------------------

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ----------------------------------------
      # 5. Tag Image
      # ----------------------------------------

      - name: Tag cart service image
        if: github.event_name == 'push'
        run: |
          docker tag \
            luxora-cart-service:${{ github.sha }} \
            ghcr.io/${{ github.repository }}/cart-service:${{ github.sha }}

          docker tag \
            luxora-cart-service:${{ github.sha }} \
            ghcr.io/${{ github.repository }}/cart-service:latest


      # ----------------------------------------
      # 6. Push to GHCR
      # ----------------------------------------

      - name: Push cart service image
        if: github.event_name == 'push'
