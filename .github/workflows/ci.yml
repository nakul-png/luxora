name: LUXORA CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  cart-service:
    name: Cart Service Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cart-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cart-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Docker build
        run: docker build -t luxora-cart-service .

  product-service:
    name: Product Service Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: product-service
        run: pip install -r requirements.txt

      - name: Docker build
        working-directory: product-service
        run: docker build -t luxora-product-service .