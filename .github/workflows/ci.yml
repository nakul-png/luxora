          docker push ghcr.io/${{ github.repository }}/cart-service:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/cart-service:latest


  # ============================================================
  # PRODUCT SERVICE
  # ============================================================

  product-service:
    name: Product Service Docker Build + Trivy Scan + Push
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # 1. Checkout
      # ----------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4


      # ----------------------------------------
      # 2. Build Docker Image
      # ----------------------------------------

      - name: Build product service image
